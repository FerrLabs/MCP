version: '3.9'

services:
  # TimescaleDB (PostgreSQL 16 + TimescaleDB extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ferrflow-timescaledb
    environment:
      POSTGRES_USER: ferrflow
      POSTGRES_PASSWORD: ferrflow_dev_password
      POSTGRES_DB: ferrflow
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferrflow-network

  # HashiCorp Vault (dev mode - NOT for production)
  vault:
    image: hashicorp/vault:latest
    container_name: ferrflow-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ferrflow-network

  # Redis (cache pour DEKs et sessions)
  redis:
    image: redis:8-alpine
    container_name: ferrflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ferrflow-network

volumes:
  timescale_data:
    driver: local
  redis_data:
    driver: local

networks:
  ferrflow-network:
    driver: bridge
