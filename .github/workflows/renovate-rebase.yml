name: Renovate rebase now

on:
  pull_request:
    types: [edited]

jobs:
  dispatch:
    uses: FerrLabs/.github/.github/workflows/reusable-renovate-dispatch.yml@93b84d0ede21e89cc647deafe4a719711c7e489a # main
    with:
      # This repo is public, so the job cannot use the default `ferrlabs-k8s`
      # runner: that group sets `allows_public_repositories=false`, which is
      # what keeps public-repo workflows away from the cluster.
      runner: ubuntu-latest
    secrets: inherit
