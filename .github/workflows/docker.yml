name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR_MINOR=$(echo ${VERSION} | cut -d. -f1-2)

          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/ferrflow-org/mcp:${VERSION} .
          docker tag ghcr.io/ferrflow-org/mcp:${VERSION} ghcr.io/ferrflow-org/mcp:${MAJOR_MINOR}
          docker tag ghcr.io/ferrflow-org/mcp:${VERSION} ghcr.io/ferrflow-org/mcp:latest

          docker push ghcr.io/ferrflow-org/mcp:${VERSION}
          docker push ghcr.io/ferrflow-org/mcp:${MAJOR_MINOR}
          docker push ghcr.io/ferrflow-org/mcp:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/ferrflow-org/mcp:${VERSION} | cut -d@ -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Pushed mcp:${VERSION}, ${MAJOR_MINOR}, latest"
      - name: Attest build provenance
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/ferrflow-org/mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
