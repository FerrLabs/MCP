name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        run: pnpm build

  build-check:
    name: Build Docker image (check)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -t ghcr.io/ferrflow-org/mcp:check .

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Configure git
        run: git remote set-url origin https://x-access-token:${{ secrets.FERRFLOW_TOKEN }}@github.com/${{ github.repository }}
      - uses: FerrFlow-Org/ferrflow@v0
        with:
          dry_run: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Build and push Docker image
        if: inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(git tag --list "mcp@v*" --sort=-version:refname | head -1 | sed 's/.*@v//')
          if [ -z "$version" ]; then
            echo "No version tag found, skipping image push"
            exit 0
          fi
          major_minor=$(echo ${version} | cut -d. -f1-2)

          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/ferrflow-org/mcp:${version} .
          docker tag ghcr.io/ferrflow-org/mcp:${version} ghcr.io/ferrflow-org/mcp:${major_minor}
          docker tag ghcr.io/ferrflow-org/mcp:${version} ghcr.io/ferrflow-org/mcp:latest

          docker push ghcr.io/ferrflow-org/mcp:${version}
          docker push ghcr.io/ferrflow-org/mcp:${major_minor}
          docker push ghcr.io/ferrflow-org/mcp:latest

          echo "Pushed mcp:${version}, ${major_minor}, latest"
