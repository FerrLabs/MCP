name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@main
    with:
      enable-sonar: true
      install-args: ''
      enable-lint: false
      enable-knip: false
      enable-madge: false
      enable-audit: false
    secrets: inherit

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: FerrLabs/FerrFlow@v5
        with:
          dry_run: ${{ inputs.dry_run }}
          bot: true
