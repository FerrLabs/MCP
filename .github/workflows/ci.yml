name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    # Le workflow appele finit par appeler reusable-sonarqube-scan, qui demande
    # `pull-requests: write` pour commenter le delta sur les PR. Un workflow
    # appele ne peut pas obtenir plus que ce que son appelant lui accorde, et le
    # defaut du repo est `read` : sans cette ligne, GitHub refuse de demarrer le
    # run entier (startup_failure, aucun job cree, aucun message exploitable).
    # La condition `enable-sonar` ne protege pas : les permissions sont validees
    # au demarrage, avant toute evaluation de `if`.
    permissions:
      contents: read
      pull-requests: write
      # Le reusable declare `packages: read` (registre npm GitHub pour les
      # paquets `@ferrlabs/*`). Un workflow appele ne peut pas obtenir plus que
      # son appelant : sans cette ligne la permission tombe a `none` et le run
      # entier est refuse au demarrage, comme ci-dessus.
      packages: read
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@67e9379b88113fa45ca5aaa073c7afa46d3f29ca # main
    with:
      enable-sonar: true
      install-args: ''
      enable-lint: false
      enable-knip: true
      enable-madge: true
      madge-paths: packages/*/src
      enable-audit: true
    secrets: inherit

  release:
    name: Release
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@67e9379b88113fa45ca5aaa073c7afa46d3f29ca # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets: inherit
