name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ferrflow-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  build-check:
    name: Build Docker image (check)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ferrflow-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: buildah build -t ghcr.io/ferrflow-org/mcp:check .

  release:
    name: Release
    needs: test
    runs-on: ferrflow-k8s
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Configure git
        run: git remote set-url origin https://x-access-token:${{ secrets.FERRFLOW_TOKEN }}@github.com/${{ github.repository }}
      - uses: FerrFlow-Org/ferrflow@v0
        with:
          dry_run: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Build and push Docker image
        if: inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(git tag --list "mcp@v*" --sort=-version:refname | head -1 | sed 's/.*@v//')
          if [ -z "$version" ]; then
            echo "No version tag found, skipping image push"
            exit 0
          fi
          major_minor=$(echo ${version} | cut -d. -f1-2)

          buildah login -u ${{ github.actor }} -p ${GITHUB_TOKEN} ghcr.io
          buildah build -t ghcr.io/ferrflow-org/mcp:${version} .
          buildah tag ghcr.io/ferrflow-org/mcp:${version} ghcr.io/ferrflow-org/mcp:${major_minor}
          buildah tag ghcr.io/ferrflow-org/mcp:${version} ghcr.io/ferrflow-org/mcp:latest

          buildah push ghcr.io/ferrflow-org/mcp:${version}
          buildah push ghcr.io/ferrflow-org/mcp:${major_minor}
          buildah push ghcr.io/ferrflow-org/mcp:latest

          echo "Pushed mcp:${version}, ${major_minor}, latest"
