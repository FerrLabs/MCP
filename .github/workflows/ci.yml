name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@9d30d151f9b45c94bca36c54bde080885073fe94 # main
    with:
      enable-sonar: true
      install-args: ''
      enable-lint: false
      enable-knip: true
      enable-madge: true
      madge-paths: packages/*/src
      enable-audit: true
    secrets: inherit

  release:
    name: Release
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.test.result == 'success')
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@9d30d151f9b45c94bca36c54bde080885073fe94 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets: inherit
