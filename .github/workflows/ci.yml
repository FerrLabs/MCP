name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run'
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ferrflow-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  build:
    name: Build Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ferrflow-k8s
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          buildah login -u ${{ github.actor }} -p ${GITHUB_TOKEN} ghcr.io
          buildah build -t ghcr.io/ferrflow-org/mcp:sha-${{ github.sha }} .
          buildah tag ghcr.io/ferrflow-org/mcp:sha-${{ github.sha }} ghcr.io/ferrflow-org/mcp:latest
          buildah push ghcr.io/ferrflow-org/mcp:sha-${{ github.sha }}
          buildah push ghcr.io/ferrflow-org/mcp:latest

  release:
    name: Release
    needs: [test, build]
    runs-on: ferrflow-k8s
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Configure git
        run: git remote set-url origin https://x-access-token:${{ secrets.FERRFLOW_TOKEN }}@github.com/${{ github.repository }}
      - uses: FerrFlow-Org/ferrflow@v0
        with:
          dry_run: ${{ inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.FERRFLOW_TOKEN }}
      - name: Login to GHCR
        if: inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: buildah login -u ${{ github.actor }} -p ${GITHUB_TOKEN} ghcr.io
      - name: Retag image with semver version
        if: inputs.dry_run != 'true'
        run: |
          version=$(git tag --list "mcp@v*" --sort=-version:refname | head -1 | sed 's/.*@v//')
          if [ -n "$version" ]; then
            buildah pull ghcr.io/ferrflow-org/mcp:sha-${{ github.sha }} 2>/dev/null || true
            buildah tag ghcr.io/ferrflow-org/mcp:sha-${{ github.sha }} ghcr.io/ferrflow-org/mcp:${version} || true
            buildah push ghcr.io/ferrflow-org/mcp:${version} || true
            echo "Pushed mcp:${version}"
          fi
